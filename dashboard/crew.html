<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crew Controller | RippleETA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-grain" data-view="crew">
  
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-link" style="color:var(--muted); text-decoration:none; margin-right: 1rem; font-family:var(--sans); font-weight:500;">&larr; Roles</a>
      <a class="brand" href="#" aria-label="RippleETA home">
        <span class="brand-mark">R</span>
        <span class="brand-logotype">RippleETA</span>
      </a>
      <div class="divider"></div>
      <span class="view-title">CREW INTELLIGENCE</span>
    </div>
        <div class="topbar-right">
      <div class="topbar-actions">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">HI</button>
        </div>
        <button class="btn-faq-trigger" type="button" aria-label="Open FAQ">
          <span style="font-weight:bold;">?</span>
          <span data-i18n="helpFaq">FAQ</span>
        </button>
      </div>
      <div class="ticker-mode is-replay" id="ticker-mode">REPLAY</div>
      <span class="connection-status"><span class="signal-dot is-online" id="connection-dot"></span><span id="connection-label">API ONLINE</span></span>
      <div class="clock" id="clock">--:-- IST</div>
    </div>
  </div>

  <div class="app-layout">
    <main class="main-content">
      
      <header class="view-header">
        <div class="header-left">
          <h1 class="view-headline" data-i18n="crewTitle">Duty Limits</h1>
          <p class="view-subhead" data-i18n="crewSubhead">Relief timing against the model's P50/P90 arrival window.</p>
        </div>
        <div class="header-right">
          <div class="train-input-group">
            <label for="train-id" data-i18n="focalTrain">FOCAL TRAIN</label>
            <input type="text" id="train-id" class="train-input" value="20507">
            <button id="refresh-button" class="btn-refresh" aria-label="Refresh data">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path></svg>
            </button>
          </div>
        </div>
      </header>

      <section class="view-panel is-active" id="crew-view" data-panel="crew">
        
        <div class="hoer-overlap-container">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 0.5rem;">
              <div>
                <h2 class="hoer-title" data-i18n="crewOverlapTitle">HOER vs Arrival Overlap</h2>
                <p class="hoer-sub" id="hoer-train-label">Evaluating focal train...</p>
              </div>
              <div id="duty-threat-badge" class="urgency-badge" style="background:rgba(61,122,92,0.15); color:var(--success); border:1px solid currentColor;">
                SAFE COMPLIANCE
              </div>
            </div>
            
            <div class="hoer-track" id="hoer-track" style="position:relative; min-height:48px; background:rgba(27,42,74,0.06); border-radius:6px; overflow:hidden; margin: 1.5rem 0;">
                <!-- Javascript injects scaleX bars and hazard zone -->
                <div class="hoer-marker" style="padding:12px; font-family:var(--mono); color:var(--muted);">Loading duty limit model...</div>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem;">
              <p class="hoer-status" id="hoer-status" style="margin:0;">--</p>
              <div id="relief-countdown-wrap" style="font-family:var(--mono); font-size:0.85rem; color:var(--primary); font-weight:600;">
                Sign-on target: <span id="relief-countdown-digits" class="odometer-counter">--:--:--</span>
              </div>
            </div>
        </div>
        
      </section>

    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
